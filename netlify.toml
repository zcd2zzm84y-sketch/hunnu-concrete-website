[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

# Keep links relative so they work behind the hunnu.asia/talent proxy
[build.processing.html]
  pretty_urls = false
